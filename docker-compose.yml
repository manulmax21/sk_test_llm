services:
  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  backend:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - ollama
    environment:
      - APP_OLLAMA_URL=http://ollama:11434
      - APP_MODEL_NAME=qwen3:1.7b

volumes:
  ollama_data:
