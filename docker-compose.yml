services:
  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  backend:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - ollama
    environment:
      - APP_OLLAMA_URL=http://ollama:11434

volumes:
  ollama_data:
